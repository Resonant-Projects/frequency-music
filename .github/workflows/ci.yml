name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun test convex/*.test.ts
      - run: bun run test:harness

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # web tsc typechecks ../convex sources via _generated/api, which import
      # root-only packages — install root deps too or tsc fails on clean checkouts
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bunx panda codegen && bunx panda cssgen
      - run: bunx tsc --noEmit

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun test
