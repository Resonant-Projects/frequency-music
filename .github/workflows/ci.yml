name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      - run: bun install --frozen-lockfile
      - run: vp run lint:check
      - run: vp run format:check
      # `vp run test` (= vp test convex scripts) rather than a hardcoded subset,
      # so CI coverage tracks package.json instead of drifting from it.
      - run: vp run test
      - run: vp run test:harness
      - run: python3 scripts/recovery/tests/test-native-pause-controller.py

  web:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep >= 1.4.1. Bun 1.3.13-1.4.0's streaming extractor flakily
          # failed web's install with "Fail extracting tarball"
          # (oven-sh/bun#34861, #40063).
          bun-version: '1.4.2'
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      # web tsc typechecks ../convex sources via _generated/api, which import
      # root-only packages — install root deps too or tsc fails on clean checkouts
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: vpx panda codegen && vpx panda cssgen
      - run: vpx tsc --noEmit

  agent:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      # agent tsc reaches ../convex/shared, whose imports (zod, convex-helpers)
      # resolve from root node_modules — install root deps too
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: vp run verify
      - run: vp test

  media:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      # media tsc reaches ../convex/shared, whose imports resolve from root
      # node_modules — install root deps too
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: media
      # The media tests drive real ffmpeg/ffprobe binaries.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: vp run typecheck:media
      - run: vp run test:media
