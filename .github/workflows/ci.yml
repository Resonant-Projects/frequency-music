name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run lint:check
      - run: vp run format:check
      - run: vp test convex
      - run: vp run test:harness

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      # web tsc typechecks ../convex sources via _generated/api, which import
      # root-only packages — install root deps too or tsc fails on clean checkouts
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp install --frozen-lockfile
      - run: vpx panda codegen && vpx panda cssgen
      - run: vpx tsc --noEmit

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      # agent tsc reaches ../convex/shared, whose imports (zod, convex-helpers)
      # resolve from root node_modules — install root deps too
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp install --frozen-lockfile
      - run: vp run verify
      - run: vp test
