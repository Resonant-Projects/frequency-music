name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun audit --prod
      - run: vp run lint:check
      - run: vp run format:check
      # `vp run test` (= vp test convex scripts) rather than a hardcoded subset,
      # so CI coverage tracks package.json instead of drifting from it.
      - run: vp run test
      - run: vp run test:harness
      - run: python3 scripts/recovery/tests/test-native-pause-controller.py

  web:
    # Enable web first, only after coordinator acceptance of the restricted
    # frequency-arc registration. Unset/false restores GARM; forks stay on GARM.
    runs-on: ${{ fromJSON(github.repository == 'Resonant-Projects/frequency-music' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.FREQUENCY_ARC_WEB_ENABLED == 'true' && '["frequency-arc"]' || '["self-hosted", "linux", "x64", "incus", "garm", "ephemeral"]') }}
    defaults:
      run:
        working-directory: web
    env:
      # Keep cache archives portable across GARM and ARC workspace layouts.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep >= 1.4.1. Bun 1.3.13-1.4.0's streaming extractor flakily
          # failed web's install with "Fail extracting tarball"
          # (oven-sh/bun#34861, #40063).
          bun-version: "1.4.2"
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false
      # web tsc typechecks ../convex sources via _generated/api, which import
      # root-only packages — install root deps too or tsc fails on clean checkouts
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun audit --prod
      - run: vpx panda codegen && vpx panda cssgen
      - run: vpx tsc --noEmit

  agent:
    # Enable agent only after web acceptance. Roll back each job independently
    # by clearing its opt-in; never send fork PRs to the restricted ARC runner.
    runs-on: ${{ fromJSON(github.repository == 'Resonant-Projects/frequency-music' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.FREQUENCY_ARC_AGENT_ENABLED == 'true' && '["frequency-arc"]' || '["self-hosted", "linux", "x64", "incus", "garm", "ephemeral"]') }}
    defaults:
      run:
        working-directory: agent
    env:
      # Keep cache archives portable across GARM and ARC workspace layouts.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false
      # agent tsc reaches ../convex/shared, whose imports (zod, convex-helpers)
      # resolve from root node_modules — install root deps too
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun audit --prod
      - run: vp run verify
      - run: vp test

  media:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          # Cached absolute paths can belong to a different runner home.
          no-cache: true
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false
      # media tsc reaches ../convex/shared, whose imports resolve from root
      # node_modules — install root deps too
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: media
      - run: bun audit
        working-directory: media
      - run: bun audit --prod
        working-directory: media
      # Real audio and SuperCollider renders are required on every media runner.
      - run: >-
          sudo apt-get update &&
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          ffmpeg supercollider-language supercollider-server
      - run: vp run typecheck:media
      - run: vp run test:media
