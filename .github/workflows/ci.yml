name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: false
      - run: bun install --frozen-lockfile
      - run: vp run lint:check
      - run: vp run format:check
      # `vp run test` (= vp test convex scripts) rather than a hardcoded subset,
      # so CI coverage tracks package.json instead of drifting from it.
      - run: vp run test
      - run: vp run test:harness

  web:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: false
      # web tsc typechecks ../convex sources via _generated/api, which import
      # root-only packages — install root deps too or tsc fails on clean checkouts
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: vpx panda codegen && vpx panda cssgen
      - run: vpx tsc --noEmit

  agent:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs only read the repo — never let checkout leave a
          # write-capable token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: false
      # agent tsc reaches ../convex/shared, whose imports (zod, convex-helpers)
      # resolve from root node_modules — install root deps too
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: vp run verify
      - run: vp test
