name: Public Editorial Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    permissions:
      contents: write
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLIC_APP_BASE_URL: ${{ vars.PUBLIC_APP_BASE_URL || 'https://app.resonantprojects.art' }}
      EXPORT_BRANCH: editorial-export
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate public editorial snapshot
        env:
          CONVEX_URL: ${{ vars.CONVEX_SELF_HOSTED_URL || 'https://convex.resonantprojects.art' }}
          DEV_BYPASS_SECRET: ${{ secrets.AUTH_BYPASS_SECRET }}
          PUBLIC_APP_BASE_URL: ${{ vars.PUBLIC_APP_BASE_URL || 'https://app.resonantprojects.art' }}
        run: |
          test -n "${DEV_BYPASS_SECRET}"
          vp node scripts/export-editorial.ts --output-dir exports/public-editorial/v1

      - name: Publish snapshot branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .editorial-export
          if git ls-remote --exit-code --heads origin "${EXPORT_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${EXPORT_BRANCH}" "${remote_url}" .editorial-export
          else
            git clone --depth 1 "${remote_url}" .editorial-export
            cd .editorial-export
            git checkout --orphan "${EXPORT_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          find .editorial-export -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R exports/public-editorial/v1/. .editorial-export/

          cd .editorial-export
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No editorial export changes to publish."
            exit 0
          fi
          git commit -m "Export public editorial snapshot"
          git push origin HEAD:"${EXPORT_BRANCH}"
