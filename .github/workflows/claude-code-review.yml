name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip bot-authored PRs (Renovate, Dependabot). The action refuses
    # non-human actors and fails the check, and allowing bots would spend a
    # paid review on every dependency bump.
    if: github.event.pull_request.user.type != 'Bot'

    # Claude Code Action's Bun runtime currently crashes on the GARM pool's
    # non-AVX CPU profile, so keep this automation on a hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # contents: read above means this token cannot push, so persisting it
          # into .git/config buys nothing and leaves it readable to later steps.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Classify review startup failure without exposing response text
        if: failure() && steps.claude-review.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "claude-execution-output.json"
          if not path.is_file():
              print("Review diagnostic: execution report unavailable")
              raise SystemExit(0)
          events = json.loads(path.read_text())
          # Never print provider responses, prompts, environment, or credentials.
          errors = " ".join(
              json.dumps(event).lower() for event in events
              if event.get("type") == "result" and event.get("is_error")
          )
          categories = {
              "authentication": ["oauth", "unauthorized", "authentication", "invalid api key"],
              "quota": ["rate limit", "usage limit", "credit balance", "quota"],
              "model": ["model not found", "invalid model", "model is not available"],
              "plugin": ["unknown skill", "unknown slash command", "plugin not found"],
          }
          matched = [name for name, needles in categories.items() if any(n in errors for n in needles)]
          print("Review diagnostic: " + (", ".join(matched) or "unclassified provider/CLI failure"))
          PYTHON
