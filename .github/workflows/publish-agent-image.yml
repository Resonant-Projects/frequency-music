name: Publish agent image

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/publish-agent-image.yml
      - agent/**
      - convex/shared/**
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/publish-agent-image.yml
      - agent/**
      - convex/shared/**
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git commit to build; use the deployed commit for artifact-only migration
        required: true
        type: string

concurrency:
  group: agent-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/resonant-projects/frequency-music-agent

jobs:
  validate:
    name: Build and scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive image tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          printf 'image_ref=%s:pr-%s\n' "$image_name" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Audit production dependencies
        working-directory: agent
        run: bun audit --prod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build pull-request image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agent/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.image_ref }}
          cache-from: type=gha,scope=frequency-agent
          cache-to: type=gha,mode=max,scope=frequency-agent

      - name: Smoke-test hardened runtime
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec '
            command -v node
            command -v codex
            ! command -v npm
            test ! -d /usr/local/lib/node_modules/npm
            test ! -e node_modules/@typescript/typescript-linux-x64
            node_modules/.bin/tsx --version
            codex --version
          '

      - name: Scan pull-request image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image_ref }}
          version: v0.70.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  publish:
    name: Build, scan, and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write # Attach GitHub provenance to the published digest.
      contents: read
      id-token: write # Mint the OIDC identity used to sign the attestation.
      packages: write # Push the immutable image and its attestations to GHCR.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.metadata.outputs.image_name }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Derive immutable image coordinates
        id: metadata
        env:
          REQUESTED_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            requested_source_sha="${REQUESTED_SOURCE_REF,,}"
            if [[ ! "$requested_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'source_ref must be a full 40-character commit SHA' >&2
              exit 1
            fi
            if [[ "$requested_source_sha" != "$source_sha" ]]; then
              echo 'source_ref does not match the checked-out commit' >&2
              exit 1
            fi
          fi
          image_name="${IMAGE_NAME,,}"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s:sha-%s\n' "$image_name" "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Audit production dependencies
        working-directory: agent
        run: bun audit --prod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable agent image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.revision=${{ steps.metadata.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frequency-agent
          cache-to: type=gha,mode=max,scope=frequency-agent
          provenance: mode=max
          sbom: true

      - name: Smoke-test hardened runtime
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec '
            command -v node
            command -v codex
            ! command -v npm
            test ! -d /usr/local/lib/node_modules/npm
            test ! -e node_modules/@typescript/typescript-linux-x64
            node_modules/.bin/tsx --version
            codex --version
          '

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image_name }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Attest published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write deployment manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME_LOWER: ${{ steps.metadata.outputs.image_name }}
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$IMAGE_NAME_LOWER" \
            --arg tag "$IMAGE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            '{repository: $repository, source_sha: $source_sha, image: $image, tag: $tag, digest: $digest, deploy: ($image + "@" + $digest)}' \
            > deployment.json

      - name: Upload deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-image-${{ steps.metadata.outputs.source_sha }}
          path: deployment.json
          if-no-files-found: error
          retention-days: 30

  harbor:
    name: Copy, sign, and scan in Lab Harbor
    needs: publish
    # Only main-sourced builds reach Harbor: pushes to main, or a dispatch from
    # main whose source_ref is already on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # registry.rproj.art is reachable only from the Lab LAN.
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    timeout-minutes: 30
    environment: harbor-publish # Protected, main only; holds the robot secret.
    permissions:
      contents: read
      id-token: write # Mint the OIDC identity used for keyless cosign signing.
    env:
      HARBOR_REGISTRY: registry.rproj.art
      HARBOR_REPOSITORY: frequency-music/frequency-music-agent
      HARBOR_USERNAME: robot$frequency-music-publisher
      SIGNER_IDENTITY: https://github.com/Resonant-Projects/frequency-music/.github/workflows/publish-agent-image.yml@refs/heads/main
      SIGNER_ISSUER: https://token.actions.githubusercontent.com
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_IMAGE: ${{ needs.publish.outputs.image_name }}
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
    steps:
      - name: Confirm the published source is on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'publish job returned no immutable image coordinates' >&2
            exit 1
          fi
          # A dispatch may name any commit; only one already on main may be
          # signed with this workflow's main identity.
          python3 - <<'PY'
          import json, os, urllib.request
          env = os.environ
          url = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/compare/{env['SOURCE_SHA']}...{env['GITHUB_SHA']}?per_page=1"
          request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {env['GITHUB_TOKEN']}"})
          with urllib.request.urlopen(request, timeout=60) as response:
              status = json.load(response)["status"]
          if status not in ("ahead", "identical"):
              raise SystemExit(f"{env['SOURCE_SHA']} is not on main ({status})")
          PY
          # A rebuild of the same commit gets a new index digest (BuildKit
          # provenance), so the immutable tag names the digest too; retries of
          # one build reuse it and a rebuild gets its own.
          target_tag_name="sha-${SOURCE_SHA}-${IMAGE_DIGEST:7:12}"
          {
            printf 'TARGET_TAG_NAME=%s\n' "$target_tag_name"
            printf 'TARGET_TAG=%s/%s:%s\n' "$HARBOR_REGISTRY" "$HARBOR_REPOSITORY" "$target_tag_name"
            printf 'TARGET_REF=%s/%s@%s\n' "$HARBOR_REGISTRY" "$HARBOR_REPOSITORY" "$IMAGE_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Install pinned crane and cosign
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$bin" crane
          curl -fsSL -o "$bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $bin/cosign" | sha256sum -c -
          chmod 0755 "$bin/crane" "$bin/cosign"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install Harbor API helper
        # Harbor refuses registry reads of unsigned manifests in cosign-enforced
        # projects, so existence, signature, and scan checks use its v2 API.
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bin/harbor-artifact" <<'PY'
          #!/usr/bin/env python3
          """Query the agent repository's Harbor artifacts with the robot credentials.

          digest REF        print REF's digest, or nothing when REF is absent
          amd64 REF         print the linux/amd64 image digest of index REF
          signed REF        exit 0 when REF has a cosign signature accessory
          scan REF SECONDS  wait for REF's vulnerability scan; print its summary
          """
          import base64, json, os, sys, time, urllib.error, urllib.parse, urllib.request

          REPORT = "application/vnd.security.vulnerability.report; version=1.1"
          env = os.environ
          project, _, repository = env["HARBOR_REPOSITORY"].partition("/")
          repository = urllib.parse.quote(urllib.parse.quote(repository, safe=""), safe="")
          base = f"https://{env['HARBOR_REGISTRY']}/api/v2.0/projects/{project}/repositories/{repository}/artifacts"
          auth = base64.b64encode(f"{env['HARBOR_USERNAME']}:{env['HARBOR_PASSWORD']}".encode()).decode()


          def api(ref, suffix="", method="GET"):
              request = urllib.request.Request(
                  f"{base}/{urllib.parse.quote(ref, safe=':')}{suffix}",
                  data=b"" if method == "POST" else None,
                  method=method,
                  # Ask for the generic report the scan wait parses. Harbor
                  # already returns it by default; this pins it.
                  headers={"Accept": "application/json", "Authorization": f"Basic {auth}",
                           "X-Accept-Vulnerabilities": REPORT},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read() or b"null")
              except urllib.error.HTTPError as err:
                  if err.code == 404 and method == "GET":
                      return None
                  sys.exit(f"{method} {ref}{suffix}: HTTP {err.code}")


          command, ref = sys.argv[1], sys.argv[2]
          if command == "digest":
              print((api(ref) or {}).get("digest", ""))
          elif command == "amd64":
              artifact = api(ref)
              if artifact is None:
                  sys.exit(f"{ref} is not in Harbor")
              children = artifact.get("references") or []
              amd64 = [
                  child["child_digest"]
                  for child in children
                  if (child.get("platform") or {}).get("os") == "linux"
                  and (child.get("platform") or {}).get("architecture") == "amd64"
              ]
              if children and not amd64:
                  sys.exit(f"{ref} has no linux/amd64 image")
              print(amd64[0] if amd64 else artifact["digest"])
          elif command == "signed":
              accessories = (api(ref, "?with_accessory=true") or {}).get("accessories") or []
              sys.exit(0 if any(a.get("type") == "signature.cosign" for a in accessories) else 1)
          elif command == "scan":
              started = time.monotonic()
              requested = False
              while True:
                  artifact = api(ref, "?with_scan_overview=true&with_accessory=true") or {}
                  overview = (artifact.get("scan_overview") or {}).get(REPORT) or {}
                  status = overview.get("scan_status")
                  if status == "Success":
                      summary = overview.get("summary") or {}
                      print(json.dumps({
                          "digest": ref,
                          "scanner": overview.get("scanner"),
                          "severity": overview.get("severity"),
                          "total": summary.get("total"),
                          "fixable": summary.get("fixable"),
                          "counts": summary.get("summary"),
                      }, indent=2))
                      break
                  if status in ("Error", "Stopped"):
                      sys.exit(f"{ref} scan status {status}")
                  # The project scans on push; request one only if none has started.
                  if not status and not requested and time.monotonic() - started > 60:
                      api(ref, "/scan", "POST")
                      requested = True
                  if time.monotonic() - started > int(sys.argv[3]):
                      sys.exit(f"{ref} scan did not finish within {sys.argv[3]}s")
                  time.sleep(15)
          else:
              sys.exit(__doc__)
          PY
          chmod 0755 "$RUNNER_TEMP/bin/harbor-artifact"

      - name: Log in to Harbor
        env:
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PUBLISH_ROBOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" \
            | crane auth login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin

      - name: Copy published digest to Harbor
        env:
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PUBLISH_ROBOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Harbor tags are immutable: a re-run keeps an identical tag and never
          # repoints one. The public GHCR package needs no login.
          existing="$(harbor-artifact digest "$TARGET_TAG_NAME")"
          if [[ -z "$existing" ]]; then
            crane copy "${SOURCE_IMAGE}@${IMAGE_DIGEST}" "$TARGET_TAG"
          elif [[ "$existing" != "$IMAGE_DIGEST" ]]; then
            echo "$TARGET_TAG already points at $existing" >&2
            exit 1
          else
            echo "$TARGET_TAG already holds $IMAGE_DIGEST; skipping copy"
          fi
          test "$(harbor-artifact digest "$IMAGE_DIGEST")" = "$IMAGE_DIGEST"
          # The index also holds BuildKit's attestation manifest; nodes run and
          # Harbor scans the linux/amd64 image.
          amd64_digest="$(harbor-artifact amd64 "$IMAGE_DIGEST")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'AMD64_REF=%s/%s@%s\n' "$HARBOR_REGISTRY" "$HARBOR_REPOSITORY" "$amd64_digest" >> "$GITHUB_ENV"
          printf 'AMD64_DIGEST=%s\n' "$amd64_digest" >> "$GITHUB_ENV"

      - name: Sign Harbor digest
        env:
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PUBLISH_ROBOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Skip only when this workflow's own signature already verifies on both
          # manifests; any other signature still gets ours added. Recursive
          # signing right after the copy is the same path homelab-infra's
          # harbor-mirror.yml uses against this Harbor.
          verified=true
          for ref in "$TARGET_REF" "$AMD64_REF"; do
            if ! cosign verify \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$ref" > /dev/null 2>&1; then
              verified=false
            fi
          done
          if [[ "$verified" == true ]]; then
            echo 'This workflow already signed both manifests; skipping signing'
          else
            cosign sign --yes --recursive "$TARGET_REF"
          fi

      - name: Verify signature and registry digest
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$TARGET_REF" "$AMD64_REF"; do
            cosign verify \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$ref" > /dev/null
          done
          test "$(crane digest "$TARGET_REF")" = "$IMAGE_DIGEST"

      - name: Wait for Harbor vulnerability scan
        env:
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PUBLISH_ROBOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Record findings only; the publish job's Trivy gate already blocks
          # high and critical vulnerabilities.
          scan="$(harbor-artifact scan "$AMD64_DIGEST" 600)"
          {
            echo '## Harbor vulnerability scan'
            echo
            echo '```json'
            printf '%s\n' "$scan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          # Succeeds only if the project is public and cosign enforcement admits
          # the signed index and image.
          mkdir -p "$RUNNER_TEMP/anon"
          for ref in "$TARGET_REF" "$AMD64_REF"; do
            env -u DOCKER_CONFIG HOME="$RUNNER_TEMP/anon" crane manifest "$ref" > /dev/null
          done

      - name: Write Harbor deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - > "$RUNNER_TEMP/harbor-deployment.json" <<'PY'
          import json, os
          env = os.environ
          print(json.dumps({
              "source_sha": env["SOURCE_SHA"],
              "digest": env["IMAGE_DIGEST"],
              "deploy": env["TARGET_REF"],
          }, indent=2))
          PY
          {
            echo '## Harbor deployment manifest'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/harbor-deployment.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Harbor deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-image-harbor-${{ needs.publish.outputs.source_sha }}
          path: ${{ runner.temp }}/harbor-deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove registry credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.docker/config.json"
