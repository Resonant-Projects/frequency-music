name: Publish agent image

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/publish-agent-image.yml
      - agent/**
      - convex/shared/**
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/publish-agent-image.yml
      - agent/**
      - convex/shared/**
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git commit to build; use the deployed commit for artifact-only migration
        required: true
        type: string

concurrency:
  group: agent-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/resonant-projects/frequency-music-agent

jobs:
  validate:
    name: Build and scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive image tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          printf 'image_ref=%s:pr-%s\n' "$image_name" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Audit production dependencies
        working-directory: agent
        run: bun audit --prod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build pull-request image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: agent/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.image_ref }}
          cache-from: type=gha,scope=frequency-agent
          cache-to: type=gha,mode=max,scope=frequency-agent

      - name: Smoke-test hardened runtime
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec '
            command -v node
            command -v codex
            ! command -v npm
            test ! -d /usr/local/lib/node_modules/npm
            test ! -e node_modules/@typescript/typescript-linux-x64
            node_modules/.bin/tsx --version
            codex --version
          '

      - name: Scan pull-request image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image_ref }}
          version: v0.70.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  publish:
    name: Build, scan, and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write # Attach GitHub provenance to the published digest.
      contents: read
      id-token: write # Mint the OIDC identity used to sign the attestation.
      packages: write # Push the immutable image and its attestations to GHCR.
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Derive immutable image coordinates
        id: metadata
        env:
          REQUESTED_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            requested_source_sha="${REQUESTED_SOURCE_REF,,}"
            if [[ ! "$requested_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'source_ref must be a full 40-character commit SHA' >&2
              exit 1
            fi
            if [[ "$requested_source_sha" != "$source_sha" ]]; then
              echo 'source_ref does not match the checked-out commit' >&2
              exit 1
            fi
          fi
          image_name="${IMAGE_NAME,,}"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s:sha-%s\n' "$image_name" "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Audit production dependencies
        working-directory: agent
        run: bun audit --prod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable agent image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.revision=${{ steps.metadata.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frequency-agent
          cache-to: type=gha,mode=max,scope=frequency-agent
          provenance: mode=max
          sbom: true

      - name: Smoke-test hardened runtime
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec '
            command -v node
            command -v codex
            ! command -v npm
            test ! -d /usr/local/lib/node_modules/npm
            test ! -e node_modules/@typescript/typescript-linux-x64
            node_modules/.bin/tsx --version
            codex --version
          '

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image_name }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Attest published digest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.metadata.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write deployment manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME_LOWER: ${{ steps.metadata.outputs.image_name }}
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$IMAGE_NAME_LOWER" \
            --arg tag "$IMAGE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            '{repository: $repository, source_sha: $source_sha, image: $image, tag: $tag, digest: $digest, deploy: ($image + "@" + $digest)}' \
            > deployment.json

      - name: Upload deployment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-image-${{ steps.metadata.outputs.source_sha }}
          path: deployment.json
          if-no-files-found: error
          retention-days: 30
