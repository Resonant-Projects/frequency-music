name: Publish Essays

# Regenerates essay metadata and the public export whenever an essay changes on
# main, then revalidates the resonantprojects.art ISR pages that consume it.
#
# Runs alongside `public-editorial-export.yml`, which is a different route: that
# one is manual (`workflow_dispatch`), pulls evidence-card data out of Convex,
# and publishes to the orphan `editorial-export` branch. This workflow is
# automatic and covers only the static `docs/essays/*.md` corpus.
#
# Loop safety: the trigger filter matches `docs/essays/*.md`, but the commit
# below only ever touches `docs/essays/metadata.json` and `exports/blog`.
# Neither matches the filter, so the bot's own push cannot re-trigger this run.

on:
  push:
    branches: [main]
    paths:
      - "docs/essays/*.md"
      - "scripts/generate-essay-metadata.ts"
      - "scripts/export-essays.ts"
      - "scripts/lib/essay-metadata.ts"
      - "scripts/lib/parse-essay.ts"
  workflow_dispatch:

concurrency:
  group: publish-essays
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, incus, garm, ephemeral]
    steps:
      - name: Checkout main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `bun install` below runs package lifecycle scripts. Without this, the
          # push-capable token sits in the local Git credential store while they
          # run. The commit step supplies the token explicitly instead.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - run: bun install --frozen-lockfile

      - name: Generate metadata and public export
        # generate-essay-metadata.ts imports `varlock/auto-load`, which resolves
        # the whole .env.schema through the 1Password CLI. `.env.schema` commits
        # APP_ENV=dev and declares @initOp(allowAppAuth=forEnv(dev)), so without
        # APP_ENV=ci the CLI falls back to desktop-app auth and fails on a
        # headless runner. This is the schema's documented CI contract; varlock
        # resolves OPENROUTER_API_KEY itself, so no separate secret-loading step
        # is needed.
        env:
          APP_ENV: ci
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: vp run essays:publish

      - name: Validate export
        run: |
          cat > "${RUNNER_TEMP}/validate-export.mjs" <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(
            readFileSync("exports/blog/manifest.json", "utf8"),
          );
          const markdownFiles = readdirSync("exports/blog/essays").filter(
            (file) => file.endsWith(".md"),
          );

          if (manifest.version !== "frequency_essays_v1") {
            throw new Error(`Unexpected manifest version: ${manifest.version}`);
          }
          if (manifest.items.length !== markdownFiles.length) {
            throw new Error(
              `Manifest has ${manifest.items.length} items but export has ${markdownFiles.length} Markdown files`,
            );
          }

          console.log(`Validated ${manifest.items.length} exported essays.`);
          NODE
          vp node "${RUNNER_TEMP}/validate-export.mjs"

      - name: Commit refreshed export
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/essays/metadata.json exports/blog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Essay export is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/essays/metadata.json exports/blog
          git commit -m "chore(essays): refresh public export"

          # Metadata generation takes minutes, and the concurrency group only
          # serialises this workflow against itself — main can still move under
          # us mid-run. Rebase onto whatever landed and retry instead of failing
          # and leaving the export stale. The commit only touches metadata.json
          # and exports/blog, so a rebase conflict means a human edited the
          # generated export by hand and should look at it.
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; rebasing onto latest main."
            git fetch "$remote" main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Rebase onto main conflicted. Resolve docs/essays/metadata.json or exports/blog by hand."
              exit 1
            fi
          done

          echo "::error::Could not push the refreshed export after 3 attempts."
          exit 1

      - name: Revalidate Resonant Projects pages
        # A manual run is also the recovery path when a prior run pushed the
        # export but failed here. In that case the export is already current,
        # so `changed` is false even though revalidation still needs to run.
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ISR_BYPASS_TOKEN: ${{ secrets.RPROJ_ISR_BYPASS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.RPROJ_VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$ISR_BYPASS_TOKEN" ]; then
            echo "::error::RPROJ_ISR_BYPASS_TOKEN is not configured. See docs/reference/essay-publishing.md."
            exit 1
          fi
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::RPROJ_VERCEL_AUTOMATION_BYPASS_SECRET is not configured. See docs/reference/essay-publishing.md."
            exit 1
          fi

          # The website now reads the GitHub export at request time behind ISR;
          # a same-SHA Vercel deploy is both unnecessary and intentionally
          # skipped by rproj-website. Ask its authenticated endpoint to expire
          # the affected pages instead. The Vercel bypass header keeps this
          # machine-to-machine request out of the browser security challenge.
          # The Content-Type and Origin headers satisfy Astro's `checkOrigin`
          # CSRF guard, which otherwise answers 403 "Cross-site POST form
          # submissions are forbidden" before the route handler ever runs.
          # Keep the call bounded so a stalled endpoint cannot hold the
          # `publish-essays` concurrency group and stall every queued run
          # behind it.
          response_file="${RUNNER_TEMP}/rproj-revalidate.json"
          headers_file="${RUNNER_TEMP}/rproj-revalidate.headers"
          if ! curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 2 \
              --retry-all-errors \
              --retry-max-time 120 \
              --request POST \
              --header "Authorization: Bearer ${ISR_BYPASS_TOKEN}" \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              --header "Content-Type: application/json" \
              --header "Origin: https://www.resonantprojects.art" \
              --dump-header "$headers_file" \
              --output "$response_file" \
              "https://www.resonantprojects.art/api/revalidate"; then
            head -c 2000 "$headers_file" || true
            echo
            head -c 2000 "$response_file" || true
            echo
            echo "::error::Resonant Projects ISR revalidation failed."
            exit 1
          fi
          cat "$response_file"
          echo
          echo "Revalidated the Resonant Projects ISR pages."
