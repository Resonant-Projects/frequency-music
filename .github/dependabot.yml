version: 2

# Actions are pinned to full commit SHAs (with a `# vX.Y.Z` comment) so a
# compromised or retagged upstream release cannot silently change what CI runs.
# Pinning freezes them, so Dependabot owns the unfreezing: it reads the version
# comment, opens a PR with the new SHA, and updates the comment to match.
#
# Scoped to github-actions on purpose — npm deps are still updated by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
